<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shair Ali Quiz Muqabla</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#081b33,#123d68,#0b2440);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:25px 16px}.card{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:25px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{text-align:center;font-size:34px;font-weight:800;color:#ffd45a}.sub{text-align:center;color:#d8e7f5;margin-bottom:25px}
input,select,button{width:100%;padding:14px 16px;border-radius:13px;border:0;font-size:16px;margin:7px 0}input,select{background:#fff;color:#122}.btn{background:#ffc83d;color:#132238;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.08)}
.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.timer{font-size:24px;font-weight:800;color:#ffd45a}.progress{height:9px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}.bar{height:100%;background:#ffd04a;width:0;transition:.2s}
.qimg{width:100%;height:260px;object-fit:cover;border-radius:18px;margin:18px 0}.question{font-size:25px;font-weight:700;line-height:1.35;margin:10px 0 18px}.option{background:#fff;color:#142235;text-align:left;font-weight:700;cursor:pointer}.option.correct{background:#21c66d!important;color:#fff}.option.wrong{background:#ef4b4b!important;color:#fff}.option:disabled{cursor:not-allowed;opacity:1}
.feedback{text-align:center;font-weight:800;min-height:28px;margin:8px}.result{text-align:center}.score{font-size:58px;color:#ffd45a;font-weight:900}.small{color:#cfe0ef}.footer{text-align:center;margin-top:15px;color:#aac4da;font-size:13px}
@media(max-width:600px){.logo{font-size:27px}.question{font-size:20px}.qimg{height:190px}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo">🏆 SHAIR ALI QUIZ MUQABALA</div>
<div class="sub">50 Interesting Questions • 10 Seconds Each</div>

<section id="start">
<label>Name</label><input id="name" placeholder="Enter your name">
<label>Age (15+)</label><input id="age" type="number" min="15" placeholder="Enter your age">
<label>Language</label>
<select id="lang"><option value="en">🇬🇧 English</option><option value="ur">🇵🇰 اردو</option><option value="ar">🇸🇦 العربية</option><option value="fr">🇫🇷 Français</option></select>
<button class="btn" onclick="startQuiz()">START QUIZ 🚀</button>
</section>

<section id="quiz" class="hidden">
<div class="top"><b id="counter">Question 1 / 50</b><div class="timer">⏱️ <span id="time">10</span>s</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<img id="qimg" class="qimg" alt="Question image">
<div id="question" class="question"></div>
<div id="options"></div><div id="feedback" class="feedback"></div>
</section>

<section id="result" class="hidden result">
<h2>🎉 Quiz Complete!</h2><p id="hello"></p><div class="score" id="score"></div>
<p id="details"></p><button class="btn" onclick="location.reload()">PLAY AGAIN 🔄</button>
</section>
<div class="footer">Shair Ali Quiz Muqabla • Challenge your mind!</div>
</div>
</div>

<script>

["Which is the largest internal organ in the human body?","Liver","Heart","Lung","Kidney","https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&w=1200&q=80"],

["Which star pattern is commonly called the Big Dipper?","Ursa Major","Orion","Cassiopeia","Leo","https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80"],
["What is the boiling point of water at sea level?","100°C","50°C","80°C","120°C","https://images.unsplash.com/photo-1550572017-edf9c0c2d9a8?auto=format&fit=crop&w=1200&q=80"]

const T={
en:{start:"START QUIZ 🚀",q:"Question",complete:"Quiz Complete!",correct:"Correct! 🎉",wrong:"Wrong! ❌",timeout:"Time's up! ⏭️",result:"Score",details:"Correct",age:"Please enter an age of 15 or older.",name:"Please enter your name."},
ur:{start:"کوئز شروع کریں 🚀",q:"سوال",complete:"کوئز مکمل!",correct:"درست! 🎉",wrong:"غلط! ❌",timeout:"وقت ختم! ⏭️",result:"اسکور",details:"درست",age:"براہِ کرم 15 یا اس سے زیادہ عمر درج کریں۔",name:"براہِ کرم اپنا نام درج کریں۔"},
ar:{start:"ابدأ الاختبار 🚀",q:"السؤال",complete:"اكتمل الاختبار!",correct:"صحيح! 🎉",wrong:"خطأ! ❌",timeout:"انتهى الوقت! ⏭️",result:"النتيجة",details:"صحيح",age:"يرجى إدخال عمر 15 أو أكثر.",name:"يرجى إدخال اسمك."},
fr:{start:"COMMENCER 🚀",q:"Question",complete:"Quiz terminé !",correct:"Correct ! 🎉",wrong:"Faux ! ❌",timeout:"Temps écoulé ! ⏭️",result:"Score",details:"Correctes",age:"Veuillez entrer un âge de 15 ans ou plus.",name:"Veuillez entrer votre nom."}
};
let lang="en",i=0,score=0,answered=false,timer;

function startQuiz(){
 const n=document.getElementById("name").value.trim(), a=Number(document.getElementById("age").value);
 lang=document.getElementById("lang").value;
 if(!n){alert(T[lang].name);return} if(a<15){alert(T[lang].age);return}
 document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQ();
}
function showQ(){
 clearInterval(timer);answered=false;
 const q=Q[i]; document.getElementById("counter").textContent=`${T[lang].q} ${i+1} / ${Q.length}`;
 document.getElementById("bar").style.width=((i)/Q.length*100)+"%";
 document.getElementById("qimg").src=q[5];document.getElementById("question").textContent=q[0];
 const opts=[q[1],q[2],q[3],q[4]].sort(()=>Math.random()-.5);
 const box=document.getElementById("options");box.innerHTML="";
 opts.forEach(x=>{const b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>answer(b,x,q[1]);box.appendChild(b)});
 document.getElementById("feedback").textContent="";
 let t=10;document.getElementById("time").textContent=t;
 timer=setInterval(()=>{t--;document.getElementById("time").textContent=t;if(t<=0){clearInterval(timer);if(!answered){answered=true;document.getElementById("feedback").textContent=T[lang].timeout;disable();setTimeout(next,700)}}},1000);
}
function answer(btn,val,correct){
 if(answered)return;answered=true;clearInterval(timer);
 if(val===correct){score++;btn.classList.add("correct");document.getElementById("feedback").textContent=T[lang].correct}
 else{btn.classList.add("wrong");document.getElementById("feedback").textContent=T[lang].wrong;[...document.querySelectorAll(".option")].find(x=>x.textContent===correct)?.classList.add("correct")}
 disable();setTimeout(next,850);
}
function disable(){document.querySelectorAll(".option").forEach(x=>x.disabled=true)}
function next(){i++;if(i<Q.length)showQ();else finish()}
function finish(){
 clearInterval(timer);document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
 const n=document.getElementById("name").value;let pct=Math.round(score/Q.length*100);
 document.getElementById("hello").textContent=`${n}, ${T[lang].complete}`;
 document.getElementById("score").textContent=`${pct}%`;
 document.getElementById("details").textContent=`${T[lang].details}: ${score} / ${Q.length} • ${Q.length-score} skipped/wrong`;
}
</script>
</body>
</html>
